<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>refboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--canvas-bg); color: #eee;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  :root { --canvas-bg: #2b2b30; }
  /* 設定ウインドウ（キャンバス中央に出す。表示領域に吸着させる） */
  #settingsModal {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 500; display: none;
    align-items: center; justify-content: center; background: rgba(10,10,12,.5);
    transform-origin: 0 0;
  }
  #settingsModal.open { display: flex; }
  .set-panel {
    width: min(320px, 86vw); background: #2e2e34; color: #eee;
    border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 18px;
    box-sizing: border-box;
  }
  .set-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; padding: 10px 0; cursor: pointer;
  }
  .set-row input[type="color"] {
    width: 58px; height: 34px; padding: 0; border: none; background: none; cursor: pointer;
  }
  .set-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .set-row input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,.3); border-radius: 8px; }
  #setDone {
    width: 100%; height: 42px; margin-top: 8px; border: none; border-radius: 9px;
    background: #4a6cf7; color: #fff; font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .set-modes {
    display: flex; gap: 3px; background: rgba(255,255,255,.08);
    border-radius: 10px; padding: 3px; margin: 10px 0 4px;
  }
  .set-modes button {
    flex: 1; height: 34px; border: none; border-radius: 8px; background: transparent;
    color: #a5a5ad; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .set-modes button.on { background: #6f6f76; color: #fff; font-weight: 600; }
  /* 背景が明るい色の時は、右側4ボタンのアイコンをダークモードの背景色（#2b2b30）にして見えるようにする（kura指定）。
     画像アイコン（目・同期）はJS側でその色に塗り直す */
  html.canvas-light .bbtn { color: #2b2b30; }
  html.canvas-light #importBtn { color: #fff; }
  html.canvas-light .bbtn.on { color: #fff; }
  /* ライトモードではタブバーの地色もキャンバスの背景色に合わせる（kura指定） */
  html.canvas-light #tabbar { background: var(--canvas-bg); }
  /* ライトモードのタブは反転させる: 非アクティブ=グレーの地に白文字、アクティブ=白の地に濃い文字（kura指定） */
  html.canvas-light .btab { background: var(--canvas-bg); color: #2b2b30; border: 1px solid #B3B3B3; border-bottom: none; }
  html.canvas-light .btab.on { background: #C6C6C6; color: #2b2b30; border: 1px solid #656565; border-bottom: none; }
  html.canvas-light #hint { color: #83838d; }
  /* 下部バー: ヘッダーを廃止し、独立ボタンを画面下に置く（2026-11-24 kura指定のモック再現）。
     バー自体はタッチを受けず、ボタンだけが受ける */
  #bottombar {
    position: fixed; left: 0; bottom: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom));
    transform-origin: 0 0; pointer-events: none; box-sizing: border-box;
  }
  #bottombar .spacer { flex: 1; }
  .bbtn {
    position: relative; border-radius: 50%; cursor: pointer; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    pointer-events: auto; color: #fff; font-family: inherit; box-sizing: border-box;
    width: 36px; height: 36px;
    background: var(--canvas-bg); border: 1px solid #83838c;
  }
  .bbtn:active { background: #3a3a41; }
  .bbtn img { display: block; pointer-events: none; }
  #fitBtn img { width: 27px; height: 27px; }
  /* 回転の軸は画像の中心ではなく、マーク自体の中心（余白分ずれている）に合わせる */
  #syncBtn img { width: 25px; height: 25px; transform: translate(1px, -1px); transform-origin: 46.9% 53.1%; }
  /* 同期中は同期アイコンをくるくる回す（ずらし位置を保ったまま回す） */
  #syncBtn.syncing img { animation: rb-spin 0.9s linear infinite; }
  @keyframes rb-spin { from { transform: translate(1px, -1px) rotate(0deg); } to { transform: translate(1px, -1px) rotate(-360deg); } }
  #menuBtn { font-size: 19px; font-weight: 700; letter-spacing: 1px; padding-bottom: 6px; }
  #importBtn {
    width: 40px; height: 40px; background: #6f6f76; border: none;
    font-size: 30px; line-height: 1;
  }
  #importBtn:active { background: #83838b; }
  #syncBadge {
    position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 10px; background: #8e8e96; color: #fff; font-size: 11px; font-weight: 700;
    display: none; align-items: center; justify-content: center; pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #syncBadge.show { display: inline-flex; }
  /* ボード切り替えタブ（上部に吸着。作った数だけ幅を等分する） */
  #tabbar {
    position: fixed; left: 0; top: 0; width: 100%; z-index: 80;
    display: flex; gap: 6px; padding: env(safe-area-inset-top) 10px 0;
    background: var(--canvas-bg); transform-origin: 0 0; box-sizing: border-box;
  }
  .btab {
    flex: 1 1 0; min-width: 0; padding: 2px 6px; border-radius: 12px 12px 0 0; box-sizing: border-box;
    background: transparent; border: 1px solid #878787; border-bottom: none; color: #a5a5ad;
    font-size: 12px; font-family: inherit; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  /* タブは上が角丸・下が四角のプリン状。アクティブタブはタブバーの下端まで届いて見出しのように見える（kura指定） */
  .btab.on { background: #6f6f76; color: #fff; border: 1px solid transparent; }
  /* 範囲選択ボタンと複数選択まわり */
  #rangeBtn svg { width: 19px; height: 19px; display: block; pointer-events: none; }
  .bbtn.on { background: #54545e; border-color: #e8e8ec; }
  #selRect {
    position: absolute; display: none; z-index: 70; pointer-events: none;
    border: 2px dashed #9d9da6; background: transparent; box-sizing: border-box;
  }
  #multiUi { position: absolute; inset: 0; z-index: 55; pointer-events: none; }
  #groupBox { position: absolute; display: none; border: 1.5px solid #6f8dff; pointer-events: none; }
  .group-handle {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #6f8dff; border: 2px solid #fff; cursor: nwse-resize; touch-action: none;
    pointer-events: auto; display: none;
  }
  #groupDel { position: absolute; transform: translateX(-50%); pointer-events: auto; display: none; }
  /* グループ回転ゾーン: 単体と同じく、四隅の拡縮ハンドルから45°外側の透明な範囲。
     ドラッグすると選択全体が、囲いの中心を基点に回転する */
  .group-rotate {
    position: absolute; width: 16px; height: 24px; box-sizing: border-box;
    background: transparent; cursor: grab; touch-action: none;
    pointer-events: auto; display: none;
  }
  .frame.multi { outline: 2px solid #6f8dff; outline-offset: 1px; }
  /* 「…」メニュー（たまにしか使わない機能の置き場所。今後増える機能もここへ入れる） */
  #menu {
    position: absolute; bottom: calc(100% + 2px); right: 16px; z-index: 150; pointer-events: auto;
    background: rgba(28,28,33,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    padding: 6px; display: none; min-width: 210px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #menu.open { display: block; }
  .mitem {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: #eee; font-size: 14px; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-family: inherit;
  }
  .mitem:active { background: rgba(255,255,255,.1); }
  #viewport {
    position: fixed; left: 0; right: 0; bottom: 0; top: 0;
    overflow: hidden; touch-action: none; cursor: grab;
    --inv-scale: 1;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .frame {
    position: absolute; cursor: grab; touch-action: none;
    background: #3a3a40; border-radius: 4px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    /* 画像にシャドウは付けない（2026-11-24 kura指定） */
  }
  .frame img { width: 100%; height: 100%; display: block; border-radius: 4px; pointer-events: none; object-fit: fill; -webkit-user-drag: none; -webkit-touch-callout: none; }
  .frame.selected { outline: 2px solid #6f8dff; outline-offset: 1px; }
  /* 透過画像は四角い箱にしない（シャドウも付けない） */
  .frame.alpha { background: transparent; border-radius: 0; }
  .frame.alpha img { border-radius: 0; }
  /* テキスト配置: 箱いっぱいに文字を表示し、大きさは箱に合わせて自動調整する。
     デフォルトで半透明の黒背景＋白文字にし、キャンバスの明暗どちらでも読めるようにする（kura指定） */
  .frame.text { background: rgba(0,0,0,.45); border-radius: 4px; }
  .text-body {
    position: absolute; inset: 0; padding: 4px 6px; box-sizing: border-box;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; overflow: hidden;
    line-height: 1.35; color: #fff; font-family: inherit;
  }
  /* テキスト選択中はトリミング系のボタンを出さない */
  #selToolbar.textsel .act-crop, #selToolbar.textsel .act-free { display: none; }
  #textBtn { font-size: 16px; font-weight: 300; }
  /* その場編集エディタ（タップした場所・テキストの枠に重ねて出す）。
     コンテナ自体はタップを透過させ、枠の四隅のハンドルを入力中も掴めるようにする */
  #textEditor { position: absolute; display: none; pointer-events: none; z-index: 90; }
  #textEditor.on { display: block; }
  #textInput, #textEditorBtns { pointer-events: auto; }
  /* 入力中のドラッグでキャンバスがスクロールしないようにする（kura指定） */
  #textInput, #textEditorBtns, .edit-handle { touch-action: none; }
  /* テキスト編集中は、枠側の選択アウトラインを消して二重に見えないようにする */
  .frame.editing { outline: none; }
  /* ハンドルは入力欄（点線の枠）と同じ箱に付け、その頂点と一致させる */
  #textInputWrap { position: relative; }
  /* 入力エリア自体の四隅ハンドル: キーボード表示中でも、この囲いを基準に拡縮できるようにする */
  .edit-handle {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #6f8dff; border: 2px solid #fff; z-index: 5;
    pointer-events: auto; touch-action: none; display: none;
  }
  #textEditor.on .edit-handle { display: block; }
  .edit-handle[data-corner="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
  .edit-handle[data-corner="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
  .edit-handle[data-corner="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .edit-handle[data-corner="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .edit-handle::after { content: ''; position: absolute; inset: -45%; border-radius: 50%; }
  /* 入力欄は点線の四角で囲い、中はテキスト本体と同じ半透明の黒（白文字が読めるように） */
  #textInput {
    width: 100%; box-sizing: border-box; font-size: 16px; font-family: inherit; line-height: 1.4;
    padding: 8px 10px; border-radius: 0; border: 1.5px dashed #6f8dff; outline: none; resize: none; overflow-wrap: anywhere;
    background: rgba(0,0,0,.45); color: #fff;
  }
  html.canvas-light #textInput { background: rgba(0,0,0,.45); color: #fff; border-color: #656565; }
  #textEditorBtns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  /* 画像下のUI（ツールバー・拡縮ハンドル・トリミングの✓/✕）は、フレームの中ではなく
     画面固定レイヤー（#frameUi）に一組だけ置く。ズームに依らず常に同じ大きさになり、
     フレーム側の表示切替でiOSにUIの残像が二重に残る問題も起きない（2026-11-24） */
  #frameUi { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  /* 消す時は display:none まで落とす（透明化だけだとiOSで切れ端が残ることがあるため） */
  #selToolbar, #cropControls {
    position: absolute; display: none; gap: 6px; pointer-events: auto;
    transform: translateX(-50%); z-index: 96;
  }
  #selToolbar.on, #cropControls.on { display: flex; }
  /* トリミングの✓/✕は右手操作前提で、画像の右端に吸着させる */
  #cropControls { transform: translateX(-100%); }
  .resize-handle {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #6f8dff; border: 2px solid #fff; cursor: nwse-resize; touch-action: none;
    pointer-events: auto; display: none; z-index: 95;
  }
  .resize-handle.on { display: block; }
  /* ハンドルのタップ範囲だけを大きく広げる（見た目は変えない。kura指定で直径+90%） */
  .resize-handle::after, .group-handle::after, .crop-handle::after {
    content: ''; position: absolute; inset: -45%; border-radius: 50%;
  }
  /* 回転ゾーン: 四隅のハンドルから45°外側にある透明なタップ範囲（kura指定で当初8px×4px→長さ2倍・幅3倍に拡大し16px×24px）。
     見た目のハンドルは無く、ドラッグすると画像の中心を基点に回転する */
  .rotate-zone {
    position: absolute; width: 16px; height: 24px; box-sizing: border-box;
    background: transparent; cursor: grab; touch-action: none;
    pointer-events: auto; display: none; z-index: 95;
  }
  .rotate-zone.on { display: block; }
  /* トリミング（スケッチブックと同じ操作感：マスク＋四隅ハンドル＋✓/✕） */
  .frame.cropping { outline: 2px solid #3fbf72; outline-offset: 1px; }
  /* フリーフォーム切り取り（なぞった軌跡をその場で見せる） */
  .frame.freeforming { outline: 2px solid #6f8dff; outline-offset: 1px; }
  .free-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
  .free-poly { fill: rgba(111,141,255,.16); stroke: #6f8dff; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .crop-mask { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 4; }
  .frame.cropping .crop-mask { display: block; }
  .crop-mask-overlay { position: absolute; background: rgba(0,0,0,.55); }
  .crop-mask-top { top: 0; left: 0; right: 0; }
  .crop-mask-bottom { bottom: 0; left: 0; right: 0; }
  .crop-mask-left { left: 0; }
  .crop-mask-right { right: 0; }
  .crop-area {
    position: absolute; border: 2px solid #3fbf72; box-sizing: border-box;
    cursor: move; pointer-events: auto; touch-action: none;
  }
  .crop-handle {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid #3fbf72; pointer-events: auto;
    z-index: 5; touch-action: none; transform: scale(var(--inv-scale, 1));
  }
  .crop-handle.nw { left: -8px; top: -8px; cursor: nwse-resize; }
  .crop-handle.ne { right: -8px; top: -8px; cursor: nesw-resize; }
  .crop-handle.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
  .crop-handle.se { right: -8px; bottom: -8px; cursor: nwse-resize; }
  .tbtn.apply { background: #2f9e5f; border-color: #2f9e5f; color: #fff; }
  .tbtn {
    width: 27px; height: 27px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: rgba(25,25,30,.92); color: #eee; font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tbtn.del { color: #fff; font-weight: 700; font-size: 20px; }
  .tbtn img.ticon { width: 17px; height: 17px; display: block; pointer-events: none; }
  .tbtn svg { width: 16px; height: 16px; display: block; pointer-events: none; }
  /* 見た目の重心に合わせた位置の微調整（kuraの実機目視による指定値） */
  .act-dup svg { transform: translate(1px, 1px); }
  .tbtn .xgl { display: block; transform: translate(0px, -2px); }
  #hint {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    color: #9a9aa5; font-size: 14px; text-align: center; line-height: 1.9; pointer-events: none; display: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,24,.94); border: 1px solid rgba(255,255,255,.16); color: #eee;
    padding: 9px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 300; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #detail {
    position: fixed; inset: 0; z-index: 200; background: rgba(12,12,14,.96);
    display: none; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  }
  #detail.open { display: flex; }
  #detailImgWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #detailImg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  #detailForm { padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  #detailForm label { font-size: 11px; color: #99a; }
  #detailMemo, #detailSource {
    width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; color: #eee; padding: 8px 10px; font-size: 16px; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  #detailMemo { min-height: 56px; resize: vertical; }
  .drow { display: flex; gap: 8px; }
  .dbtn { flex: 1; height: 42px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #eee; font-size: 14px; cursor: pointer; }
  .dbtn.primary { background: #4a6cf7; border-color: #4a6cf7; }
  .dbtn.danger { color: #ff9a9a; }
</style>
</head>
<body>
<div id="tabbar"></div>
<div id="bottombar">

<script>
'use strict';
/* ============================================================
   refboard Phase 1
   - アプリ: kuranaga15/refboard (公開, GitHub Pages)
   - データ: kuranaga15/refboard-data (非公開) images/ thumbs/ data/index.json data/boards.json
   - ローカルが作業の正。GitHubへは Git Data API で差分同期する
   ============================================================ */
const GH_OWNER = 'kuranaga15';
const DATA_REPO = 'refboard-data';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'refboard-gh-token';
const BOARD_ID = 'b1';
/* 複数ボード（プロジェクト）対応。placements は常にアクティブなボードのもの。
   他のボードの配置は otherBoards に退避する。ボードの並びと名前は boardsMeta が持つ */
let boardsMeta = [{ id: BOARD_ID, name: 'ボード1', updatedAt: '' }];
let otherBoards = new Map();
let activeBoardId = BOARD_ID;
let deletedBoardIds = new Set();
let boardCameras = {};
function allBoardsForSave() {
  return boardsMeta.map(m => ({ id: m.id, name: m.name, updatedAt: m.updatedAt || '',
    placements: m.id === activeBoardId ? placements : (otherBoards.get(m.id) || []) }));
}
const MAIN_MAX = 1600, THUMB_MAX = 320;
const LAYOUT_ROW_H = 280, LAYOUT_GAP = 16;

/* ---------- 状態 ---------- */
let items = new Map();        // id -> item {id,file,thumb,w,h,hash,memo,sourceUrl,createdAt}
let placements = [];          // {pid,itemId,x,y,w,h,angle,z,u}  x,y は中心座標
let deletedItemIds = new Set();
let deletedPlacementIds = new Set();
let pendingUploadIds = new Set();  // 画像実体がまだGitHubに無い item id
let metaDirty = false;
let camera = { cx: 0, cy: 0, scale: 1 };
let zCounter = 20;
let selectedPid = null;

/* ---------- DOM ---------- */
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const syncBadge = document.getElementById('syncBadge');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const fileInput = document.getElementById('fileInput');

let toastTimer = null;
function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
}
function setStatus(msg) { /* ステータスログは廃止（バッジ表示に一本化）。呼び出し互換のため残す */ }

/* ---------- IndexedDB ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('refboard-db', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      db.createObjectStore('kv');
      db.createObjectStore('blobs');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(store, key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readonly').objectStore(store).get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbSet(store, key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readwrite').objectStore(store).put(val, key);
    q.onsuccess = () => res();
    q.onerror = () => rej(q.error);
  });
}
async function idbDel(store, key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    q.onsuccess = () => res();
    q.onerror = () => rej(q.error);
  });
}

/* ---------- ローカル保存 / 読込 ---------- */
async function saveLocal() {
  const data = {
    items: [...items.values()],
    placements,
    deletedItemIds: [...deletedItemIds],
    deletedPlacementIds: [...deletedPlacementIds],
    pendingUploadIds: [...pendingUploadIds],
    metaDirty, camera, zCounter,
    boardsMeta, otherBoards: [...otherBoards], activeBoardId,
    deletedBoardIds: [...deletedBoardIds], boardCameras
  };
  try { await idbSet('kv', 'state', data); } catch (e) {}
}
async function loadLocal() {
  try {
    const d = await idbGet('kv', 'state');
    if (!d) return;
    items = new Map((d.items || []).map(it => [it.id, it]));
    placements = d.placements || [];
    deletedItemIds = new Set(d.deletedItemIds || []);
    deletedPlacementIds = new Set(d.deletedPlacementIds || []);
    pendingUploadIds = new Set(d.pendingUploadIds || []);
    metaDirty = !!d.metaDirty;
    if (d.camera) camera = d.camera;
    zCounter = d.zCounter || 20;
    if (Array.isArray(d.boardsMeta) && d.boardsMeta.length) boardsMeta = d.boardsMeta;
    otherBoards = new Map(d.otherBoards || []);
    if (d.activeBoardId && boardsMeta.some(b => b.id === d.activeBoardId)) activeBoardId = d.activeBoardId;
    deletedBoardIds = new Set(d.deletedBoardIds || []);
    boardCameras = d.boardCameras || {};
    boardCameras[activeBoardId] = camera;
  } catch (e) {}
}

/* ---------- トークン ---------- */
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function askToken() {
  const t = prompt('GitHubのトークンを貼り付けてください。\n（対象: refboard-data / Contents: Read and write。この端末のブラウザにだけ保存されます。空欄でOKすると削除します）', '');
  if (t === null) return null;
  const v = t.trim();
  try { if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  return v;
}

/* ---------- GitHub API ---------- */
async function ghApi(path, options, accept) {
  const token = getToken();
  if (!token) throw new Error('トークンが未設定です');
  const res = await fetch('https://api.github.com' + path, Object.assign({}, options || {}, {
    cache: 'no-store',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': accept || 'application/vnd.github+json',
      'Content-Type': 'application/json'
    }
  }));
  return res;
}
async function ghApiJson(path, options) {
  const res = await ghApi(path, options);
  if (!res.ok) {
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch (e) {}
    throw new Error('GitHub APIエラー ' + res.status + (msg ? '：' + msg : ''));
  }
  return res.json();
}
/* 非公開リポジトリからファイルを raw で取る。404 は null */
async function ghFetchRaw(path) {
  const res = await ghApi('/repos/' + GH_OWNER + '/' + DATA_REPO + '/contents/' + path, null, 'application/vnd.github.raw+json');
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub読み込みエラー ' + res.status + ' (' + path + ')');
  return res;
}
async function ghFetchJson(path) {
  const res = await ghFetchRaw(path);
  if (!res) return null;
  try { return await res.json(); } catch (e) { return null; }
}
async function ghFetchBlob(path) {
  const res = await ghFetchRaw(path);
  if (!res) return null;
  return res.blob();
}
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode.apply(null, Array.from(bytes.subarray(i, i + CHUNK)));
  return btoa(bin);
}

/* ---------- 画像URL（ローカルblob → 無ければGitHubから取得してキャッシュ） ---------- */
const urlCache = new Map(); // itemId:kind -> objectURL
async function imageURL(item, kind) {
  const key = item.id + ':' + kind;
  if (urlCache.has(key)) return urlCache.get(key);
  let blob = null;
  try { blob = await idbGet('blobs', key); } catch (e) {}
  if (!blob && getToken()) {
    try {
      blob = await ghFetchBlob(kind === 'thumb' ? item.thumb : item.file);
      if (blob) { try { await idbSet('blobs', key, blob); } catch (e) {} }
    } catch (e) {}
  }
  if (!blob) return '';
  const url = URL.createObjectURL(blob);
  urlCache.set(key, url);
  return url;
}

/* ---------- キャンバスの色（設定で変更可・この端末に保存） ---------- */
let canvasBg = '#2b2b30', gridHex = '#ffffff';
let gridLineRGBA = 'rgba(255,255,255,.05)';
try {
  const savedColors = JSON.parse(localStorage.getItem('refboard-colors') || 'null');
  if (savedColors && /^#[0-9a-f]{6}$/i.test(savedColors.bg || '') && /^#[0-9a-f]{6}$/i.test(savedColors.grid || '')) {
    canvasBg = savedColors.bg; gridHex = savedColors.grid;
  }
} catch (e) {}
function refreshGridRGBA() {
  const n = parseInt(gridHex.slice(1), 16);
  gridLineRGBA = 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',.05)';
}
function updateCanvasLightClass() {
  const n = parseInt(canvasBg.slice(1), 16);
  const lum = 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255);
  document.documentElement.classList.toggle('canvas-light', lum > 150);
}
function applyCanvasColors() {
  document.documentElement.style.setProperty('--canvas-bg', canvasBg);
  refreshGridRGBA();
  updateCanvasLightClass();
  if (typeof refreshIconColors === 'function') refreshIconColors();
  try { localStorage.setItem('refboard-colors', JSON.stringify({ bg: canvasBg, grid: gridHex })); } catch (e) {}
  applyCamera();
}
document.documentElement.style.setProperty('--canvas-bg', canvasBg);
refreshGridRGBA();
updateCanvasLightClass();

/* ---------- カメラ / 座標 ---------- */
function applyCamera() {
  const r = viewport.getBoundingClientRect();
  world.style.transform = 'translate(' + (r.width / 2) + 'px,' + (r.height / 2) + 'px) scale(' + camera.scale + ') translate(' + (-camera.cx) + 'px,' + (-camera.cy) + 'px)';
  viewport.style.setProperty('--inv-scale', String(1 / camera.scale));
  const grid = 64 * camera.scale;
  viewport.style.backgroundImage =
    'linear-gradient(' + gridLineRGBA + ' 1px, transparent 1px), linear-gradient(90deg, ' + gridLineRGBA + ' 1px, transparent 1px)';
  viewport.style.backgroundSize = grid + 'px ' + grid + 'px';
  const ox = (r.width / 2 - camera.cx * camera.scale) % grid;
  const oy = (r.height / 2 - camera.cy * camera.scale) % grid;
  viewport.style.backgroundPosition = ox + 'px ' + oy + 'px';
  layoutFrameUi();
}
function screenToWorld(clientX, clientY) {
  const r = viewport.getBoundingClientRect();
  return {
    x: (clientX - r.left - r.width / 2) / camera.scale + camera.cx,
    y: (clientY - r.top - r.height / 2) / camera.scale + camera.cy
  };
}
function viewWorldSize() {
  const r = viewport.getBoundingClientRect();
  return { w: r.width / camera.scale, h: r.height / camera.scale };
}

/* ---------- フレーム描画 ---------- */
const frameEls = new Map(); // pid -> element
function placementByPid(pid) { return placements.find(p => p.pid === pid); }
function itemOf(p) { return items.get(p.itemId); }

function desiredKind(p) {
  return (p.w * camera.scale < 480) ? 'thumb' : 'file';
}
async function refreshFrameImage(p, el) {
  const item = itemOf(p);
  if (!item) return;
  if (item.kind === 'text') {
    const body = el.querySelector('.text-body');
    if (body && body.textContent !== (item.text || '')) { body.textContent = item.text || ''; el.dataset.fitKey = ''; fitText(p, el); }
    return;
  }
  const kind = desiredKind(p);
  if (el.dataset.itemId === item.id && el.dataset.kind === kind && el.dataset.loaded === '1') return;
  const url = await imageURL(item, kind);
  if (!url) return;
  const img = el.querySelector('img');
  img.src = url;
  el.dataset.itemId = item.id;
  el.dataset.kind = kind;
  el.dataset.loaded = '1';
}
/* フレーム要素を確実に取り除く。
   iOS Safariでは transform の付いた要素をそのまま消すと、画面にUIの残像が
   残ることがあるため、変形を外し・非表示にして描画を確定させてから外す */
function removeFrameEl(pid) {
  const el = frameEls.get(pid);
  if (!el) return;
  el.style.display = 'none';
  el.style.transform = 'none';
  el.querySelectorAll('.crop-handle').forEach(n => { n.style.transform = 'none'; });
  void el.offsetHeight;
  el.remove();
  frameEls.delete(pid);
}
/* 操作の終わりに画面全体の再描画を促す（iOSでUIの切れ端が残る対策）。
   viewport全体の不透明度を一瞬だけ変えると、中身すべての再合成が走る */
function nudgeRepaint() {
  requestAnimationFrame(() => {
    applyCamera();
    viewport.style.opacity = '0.999';
    requestAnimationFrame(() => {
      viewport.style.opacity = '';
      applyCamera();
    });
  });
}
function renderAll() {
  const alive = new Set();
  withUiBatch(() => {
  for (const p of placements) {
    alive.add(p.pid);
    let el = frameEls.get(p.pid);
    if (!el) { el = buildFrameEl(p); frameEls.set(p.pid, el); world.appendChild(el); }
    positionFrameEl(p, el);
    refreshFrameImage(p, el);
  }
  });
  for (const [pid] of [...frameEls]) {
    if (!alive.has(pid)) removeFrameEl(pid);
  }
  hintEl.style.display = placements.length ? 'none' : 'block';
  updateStatusLine();
  layoutFrameUi();
}
/* テキストの文字サイズを箱に合わせて自動調整する（ワールド単位で二分探索） */
function fitText(p, el) {
  const body = el.querySelector('.text-body');
  if (!body) return;
  const fitItem = itemOf(p);
  if (fitItem && fitItem.fontSize) {
    /* 文字サイズはテキストごとに固定。箱の大きさで変わるのは改行位置だけ（kura指定） */
    if (el.dataset.fitKey !== 'fs' + fitItem.fontSize) {
      el.dataset.fitKey = 'fs' + fitItem.fontSize;
      body.style.fontSize = fitItem.fontSize + 'px';
    }
    return;
  }
  const key = p.w + '|' + p.h + '|' + body.textContent;
  if (el.dataset.fitKey === key) return;
  el.dataset.fitKey = key;
  let lo = 6, hi = Math.max(9, p.h);
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    body.style.fontSize = mid + 'px';
    if (body.scrollHeight <= p.h + 1 && body.scrollWidth <= p.w + 1) lo = mid; else hi = mid;
  }
  body.style.fontSize = lo + 'px';
}
/* 一括配置中は、選択UIの位置計算（レイアウト読み取りを伴う）を毎フレームやらず、
   終わった時に1回だけ行う。画像が多いボードで操作直後に固まる主因だった（2026-11-25 最適化） */
let uiLayoutBatch = 0;
function withUiBatch(fn) {
  uiLayoutBatch++;
  try { fn(); } finally {
    uiLayoutBatch--;
    if (!uiLayoutBatch) { layoutFrameUi(); if (typeof layoutTextEditor === 'function') layoutTextEditor(); }
  }
}
function positionFrameEl(p, el) {
  el.style.left = (p.x - p.w / 2) + 'px';
  el.style.top = (p.y - p.h / 2) + 'px';
  el.style.width = p.w + 'px';

  for (let attempt = 0; attempt < 200; attempt++) {

    for (const f of list) {
      try {
        const buf = await f.arrayBuffer();
        const hash = await sha256Hex(buf);
        if ([...items.values()].some(it => it.hash === hash)) { dup++; continue; }
        const { main, thumb, naturalW, naturalH, alpha } = await compressImage(f);
        const id = makeId();
        const ym = id.slice(0, 4) + '/' + id.slice(4, 6);
        const item = {
          id,

      selectPlacement(null);

/* ================= 配置の操作 ================= */
function duplicatePlacement(pid) {

  if (dupSrc && dupSrc.kind === 'text') {
    /* テキストの複製は別itemにする（片方を編集しても、もう片方が変わらないように） */
    const ni = Object.assign({}, dupSrc, { id: 't-' + makeId() });
    items.set(ni.id, ni);
    dupItemId = ni.id;
  }
  const np = Object.assign({}, p, { pid: 'p-' + makeId(), itemId: dupItemId, x: p.x + 28, y: p.y + 28, z: ++zCounter, u: Date.now() });
  placements.push(np);

}
async function deletePlacementFlow(pid, record = true) {

  if (record) pushHistory();

  placements = placements.filter(q => q.pid !== pid);
  deletedPlacementIds.add(pid);
  if (!others.length) {
    /* 確認ダイアログは出さず、その場で即削除する（2026-11-24 kura決定）。

    deletedItemIds.add(p.itemId);

    idbDel('blobs', p.itemId + ':file').catch(() => {});

      const sx = clamp(Math.round(d.x * kx), 0, item.w - 1);
      const sy = clamp(Math.round(d.y * ky), 0, item.h - 1);

/* ================= 元に戻す／やり直し =================
   二本指タップ＝一段階戻る、三本指タップ＝やり直し（スケッチブックと同じ操作。kura指定）。
   遡れるのは最大5段階まで（重くしないため）。
   状態はsaveLocalと同じ形のスナップショット（画像本体は含まない）。

/* ================= フリーフォーム切り取り =================
   指でなぞった形に切り抜く。パスは常に最初の点へ閉じ、離した時点で適用する。
   形にならなかった時（点が少ない・小さすぎる・失敗）は無かったことにする（kura指定）。
   線が指で隠れる問題は仕様として気にしない */
let freeState = null;
function startFreeform(pid) {
  const p = placementByPid(pid);
  if (!p) return;
  tapGesture = null; tapTrack.clear();   /* 仕掛かり中の多指タップ判定は捨てる（遅れて発火させない） */
  if (cropState) cancelCrop(cropState.pid);
  if (freeState) endFreeform();
  selectPlacement(pid);
  const el = frameEls.get(pid);
  if (!el) return;
  freeState = { pid, frameW: p.w, frameH: p.h, points: [], drawing: false, pointerId: null };
  el.classList.add('freeforming');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'free-svg');
  svg.setAttribute('viewBox', '0 0 ' + p.w + ' ' + p.h);
  svg.setAttribute('preserveAspectRatio', 'none');
  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute('class', 'free-poly');
  svg.appendChild(poly);
  el.appendChild(svg);
  freeState.svg = svg;

  freeState.onMove = (e) => onFreePointerMove(e, pid);
  freeState.onUp = (e) => onFreePointerUp(e, pid);
  el.addEventListener('pointerdown', freeState.onDown);
  el.addEventListener('pointermove', freeState.onMove);
  el.addEventListener('pointerup', freeState.onUp);
  el.addEventListener('pointercancel', freeState.onUp);
  layoutFrameUi();
}
function endFreeform() {
  if (!freeState) return;
  const el = frameEls.get(freeState.pid);
  if (el) {
    el.classList.remove('freeforming');
    el.removeEventListener('pointerdown', freeState.onDown);
    el.removeEventListener('pointermove', freeState.onMove);
    el.removeEventListener('pointerup', freeState.onUp);
    el.removeEventListener('pointercancel', freeState.onUp);

}
function freeLocalPoint(e, p) {
  const w = screenToWorld(e.clientX, e.clientY);

    x: clamp(w.x - (p.x - freeState.frameW / 2), 0, freeState.frameW),
    y: clamp(w.y - (p.y - freeState.frameH / 2), 0, freeState.frameH)

}
function drawFreePoly() {

}
function onFreePointerDown(e, pid) {

}
function onFreePointerMove(e, pid) {

  const p = placementByPid(pid);
  if (!p) return;
  const pt = freeLocalPoint(e, p);
  const last = freeState.points[freeState.points.length - 1];
  if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= 1.5) {

async function onFreePointerUp(e, pid) {

    minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);

  const bbox = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };

async function applyFreeform(pid, pts, bbox) {
  const p = placementByPid(pid);

  const item = itemOf(p);

  let blob = null;
  try { blob = await idbGet('blobs', item.id + ':file'); } catch (e) {}
  if (!blob) {
    await imageURL(item, 'file');
    try { blob = await idbGet('blobs', item.id + ':file'); } catch (e) {}
  }
  if (!blob) { endFreeform(); return; }
  try {
    const loaded = await loadImageFromBlob(blob);
    try {
      const kx = item.w / d.frameW, ky = item.h / d.frameH;
      const bwPx = Math.max(1, Math.round(bbox.w * kx));
      const bhPx = Math.max(1, Math.round(bbox.h * ky));
      const canvas = document.createElement('canvas');
      canvas.width = bwPx; canvas.height = bhPx;
      const ctx = canvas.getContext('2d');

        const px = (pt.x - bbox.x) * kx, py = (pt.y - bbox.y) * ky;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();

      const toBlobQ = (cv, q) => new Promise(res => {
        cv.toBlob(b => {

      const ext = mainBlob.type === 'image/png' ? 'png' : 'webp';
      const ts = Math.min(1, THUMB_MAX / Math.max(bwPx, bhPx));
      const tc = document.createElement('canvas');
      tc.width = Math.max(1, Math.round(bwPx * ts)); tc.height = Math.max(1, Math.round(bhPx * ts));
      tc.getContext('2d').drawImage(canvas, 0, 0, tc.width, tc.height);

      if (!thumbBlob) throw new Error('thumb failed');

      const id = makeId();
      const ym = id.slice(0, 4) + '/' + id.slice(4, 6);

        id,
        file: 'images/' + ym + '/' + id + '.' + ext,
        thumb: 'thumbs/' + ym + '/' + id + '.' + ext,
        w: bwPx, h: bhPx, hash,
        memo: item.memo || '', sourceUrl: item.sourceUrl || '',
        alpha: true,
        createdAt: new Date().toISOString()
      };
      await idbSet('blobs', id + ':file', mainBlob);
      await idbSet('blobs', id + ':thumb', thumbBlob);
      pushHistory();
      items.set(id, newItem);
      pendingUploadIds.add(id);
      const oldItemId = p.itemId;
      p.x = (p.x - d.frameW / 2) + bbox.x + bbox.w / 2;
      p.y = (p.y - d.frameH / 2) + bbox.y + bbox.h / 2;
      p.w = bbox.w; p.h = bbox.h;
      p.itemId = id;
      p.u = Date.now();
      if (oldItemId !== id && !placements.some(q => q.itemId === oldItemId)) {
        deletedItemIds.add(oldItemId);
        items.delete(oldItemId);
        pendingUploadIds.delete(oldItemId);
        await stashBlobs(oldItemId); try { await idbDel('blobs', oldItemId + ':file'); await idbDel('blobs', oldItemId + ':thumb'); } catch (e) {}
        for (const k of [oldItemId + ':file', oldItemId + ':thumb']) {
          if (urlCache.has(k)) { URL.revokeObjectURL(urlCache.get(k)); urlCache.delete(k); }
        }
      }
      endFreeform();
      metaDirty = true;
      renderAll();
      await saveLocal();
      scheduleSync();
    } finally { URL.revokeObjectURL(loaded.url); }
  } catch (e) {
    endFreeform();   /* 失敗したら無かったことにする */
  }
}

/* ================= 同期（pull-merge-push） ================= */
let syncing = false, syncTimer = null;
/* 同期は「同期」ボタンを押した時だけ行う（2026-11-24 kura決定）。
   変更時はステータス表示を更新するだけで、自動送信はしない。 */
function scheduleSync() {
  updateStatusLine();
}
function updateStatusLine() {
  /* バッジは「まだ送信されていない新しい画像の枚数」だけを示す（0枚なら隠す）。
     移動・削除などの操作は数えない（2026-11-24 kura指定） */
  const n = pendingUploadIds.size;
  if (n > 0) {
    syncBadge.textContent = n;
    syncBadge.classList.add('show');
  } else {
    syncBadge.classList.remove('show');
  }
}
function mergeData(remoteIndex, remoteBoards) {
  const rItems = new Map(((remoteIndex && remoteIndex.items) || []).map(it => [it.id, it]));
  const del = new Set([...(remoteIndex && remoteIndex.deletedIds || []), ...deletedItemIds]);
  for (const id of del) { rItems.delete(id); items.delete(id); }
  for (const [id, it] of rItems) if (!items.has(id)) items.set(id, it);
  deletedItemIds = del;
  const rBoards = (remoteBoards && remoteBoards.boards) || [];
  const pDel = new Set([...(remoteBoards && remoteBoards.deletedPlacementIds || []), ...deletedPlacementIds]);
  deletedPlacementIds = pDel;
  const bDel = new Set([...(remoteBoards && remoteBoards.deletedBoardIds || []), ...deletedBoardIds]);
  deletedBoardIds = bDel;
  /* ボードごとに配置をマージする（名前は updatedAt が新しい方を採用） */
  const local = new Map();
  for (const m of boardsMeta) local.set(m.id, { meta: m, placements: m.id === activeBoardId ? placements : (otherBoards.get(m.id) || []) });
  const remote = new Map();
  for (const b of rBoards) remote.set(b.id, b);
  const order = [];
  for (const m of boardsMeta) if (!bDel.has(m.id)) order.push(m.id);
  for (const b of rBoards) if (!bDel.has(b.id) && !order.includes(b.id)) order.push(b.id);
  const newMeta = [], newOther = new Map();
  let newActivePlacements = null;
  for (const id of order) {
    const L = local.get(id), R = remote.get(id);
    let name = 'ボード', upd = '';
    if (L && R) { if ((R.updatedAt || '') > (L.meta.updatedAt || '')) { name = R.name || name; upd = R.updatedAt || ''; } else { name = L.meta.name; upd = L.meta.updatedAt || ''; } }
    else if (R) { name = R.name || name; upd = R.updatedAt || ''; }
    else if (L) { name = L.meta.name; upd = L.meta.updatedAt || ''; }
    newMeta.push({ id, name, updatedAt: upd });
    const byPid = new Map();
    for (const p of (R ? (R.placements || []) : [])) byPid.set(p.pid, p);
    for (const p of (L ? L.placements : [])) {
      const r = byPid.get(p.pid);
      if (!r || (p.u || 0) >= (r.u || 0)) byPid.set(p.pid, p);
    }
    for (const pid of pDel) byPid.delete(pid);
    const arr = [...byPid.values()].filter(p => items.has(p.itemId));
    if (id === activeBoardId) newActivePlacements = arr; else newOther.set(id, arr);
  }
  if (!newMeta.length) newMeta.push({ id: BOARD_ID, name: 'ボード1', updatedAt: '' });
  if (!newMeta.some(b => b.id === activeBoardId)) {
    activeBoardId = newMeta[0].id;
    newActivePlacements = newOther.get(activeBoardId) || [];
    newOther.delete(activeBoardId);
    if (boardCameras[activeBoardId]) camera = boardCameras[activeBoardId];
  }
  boardsMeta = newMeta;
  otherBoards = newOther;
  if (newActivePlacements) placements = newActivePlacements;
}
async function syncNow(manual) {
  if (syncing) return;
  if (!getToken()) { if (manual) { askToken(); updateStatusLine(); } return; }
  syncing = true;
  document.getElementById('syncBtn').classList.add('syncing');
  setStatus('同期中…');
  try {
    const base = '/repos/' + GH_OWNER + '/' + DATA_REPO;
    /* pull & merge */
    const remoteIndex = await ghFetchJson('data/index.json');
    const remoteBoards = await ghFetchJson('data/boards.json');
    mergeData(remoteIndex, remoteBoards);
    await saveLocal();
    renderAll();
    renderTabs();
    /* push が要るか判定 */
    const needPush = pendingUploadIds.size > 0 || metaDirty;
    if (!needPush) { setStatus('同期済み'); return; }
    /* blobs */
    const treeItems = [];
    const uploaded = [];
    for (const id of [...pendingUploadIds]) {
      const item = items.get(id);
      if (!item) continue;
      const fb = await idbGet('blobs', id + ':file');
      const tb = await idbGet('blobs', id + ':thumb');
      if (!fb || !tb) continue;
      const fBlob = await ghApiJson(base + '/git/blobs', { method: 'POST', body: JSON.stringify({ content: await blobToBase64(fb), encoding: 'base64' }) });
      treeItems.push({ path: item.file, mode: '100644', type: 'blob', sha: fBlob.sha });
      const tBlob = await ghApiJson(base + '/git/blobs', { method: 'POST', body: JSON.stringify({ content: await blobToBase64(tb), encoding: 'base64' }) });
      treeItems.push({ path: item.thumb, mode: '100644', type: 'blob', sha: tBlob.sha });
      uploaded.push(id);
    }
    const nowIso = new Date().toISOString();
    const indexObj = { formatVersion: 1, updatedAt: nowIso, deletedIds: [...deletedItemIds], items: [...items.values()] };
    const boardsObj = { formatVersion: 1, updatedAt: nowIso, deletedPlacementIds: [...deletedPlacementIds], deletedBoardIds: [...deletedBoardIds], boards: allBoardsForSave().map(b => ({ id: b.id, name: b.name, updatedAt: b.updatedAt || nowIso, placements: b.placements })) };
    const idxBlob = await ghApiJson(base + '/git/blobs', { method: 'POST', body: JSON.stringify({ content: utf8ToBase64(JSON.stringify(indexObj)), encoding: 'base64' }) });
    treeItems.push({ path: 'data/index.json', mode: '100644', type: 'blob', sha: idxBlob.sha });
    const brdBlob = await ghApiJson(base + '/git/blobs', { method: 'POST', body: JSON.stringify({ content: utf8ToBase64(JSON.stringify(boardsObj)), encoding: 'base64' }) });
    treeItems.push({ path: 'data/boards.json', mode: '100644', type: 'blob', sha: brdBlob.sha });
    /* commit（ref競合は最大4回リトライ。初回は ref 作成） */
    let done = false, lastErr = null;
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      try {
        let ref = null, baseCommit = null;
        try { ref = await ghApiJson(base + '/git/ref/heads/' + GH_BRANCH); } catch (e) { if (!/404/.test(e.message)) throw e; }
        if (ref) baseCommit = await ghApiJson(base + '/git/commits/' + ref.object.sha);
        const treeBody = { tree: treeItems };
        if (baseCommit) treeBody.base_tree = baseCommit.tree.sha;
        const tree = await ghApiJson(base + '/git/trees', { method: 'POST', body: JSON.stringify(treeBody) });
        const commitBody = { message: 'refboard sync', tree: tree.sha, parents: ref ? [ref.object.sha] : [] };
        const commit = await ghApiJson(base + '/git/commits', { method: 'POST', body: JSON.stringify(commitBody) });
        if (ref) {
          await ghApiJson(base + '/git/refs/heads/' + GH_BRANCH, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
        } else {
          await ghApiJson(base + '/git/refs', { method: 'POST', body: JSON.stringify({ ref: 'refs/heads/' + GH_BRANCH, sha: commit.sha }) });
        }
        done = true;
      } catch (e) {
        lastErr = e;
        if (!/422|409/.test(e.message)) throw e;
        await new Promise(r => setTimeout(r, 700));
      }
    }
    if (!done) throw lastErr || new Error('保存できませんでした');
    for (const id of uploaded) pendingUploadIds.delete(id);
    metaDirty = false;
    await saveLocal();
    renderAll();
    setStatus('同期済み ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
    if (manual) toast('同期したよ');
  } catch (err) {
    setStatus('同期エラー');
    if (manual) toast('同期に失敗したよ…' + err.message, 4200);
  } finally {
    syncing = false;
    document.getElementById('syncBtn').classList.remove('syncing');
    updateStatusLineSoon();
  }
}
function updateStatusLineSoon() { setTimeout(updateStatusLine, 1600); }
document.getElementById('syncBtn').addEventListener('click', () => syncNow(true));

/* iPad Safariではキーボードを閉じても表示領域の変更イベントが来ないことがあり、
   バーがキーボード表示中の位置（画面の途中）に残る。閉じた直後に少し遅らせて取り直す（kura報告 2026-11-25） */
function repinSoon() {
  setTimeout(() => { pinBar(); pinTabs(); }, 60);
  setTimeout(() => { pinBar(); pinTabs(); }, 400);
}
/* 大型（ドック型）キーボードでは、iPadが入力欄を見せるために画面そのものを
   スクロールし、閉じてもそのスクロールが残ってページ全体が上にズレることがある
   （下に白い帯が出て、上のタブが画面外に出る。kura報告 2026-11-26）。
   このアプリに画面スクロールは存在しないので、入力中でない時にスクロールが
   残っていたらゼロに戻す */
setInterval(() => {
  if (document.hidden) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')) return;
  if (typeof textEdit !== 'undefined' && textEdit) return;
  const vv = window.visualViewport;
  if ((vv && vv.offsetTop > 0) || window.scrollY > 0) window.scrollTo(0, 0);
}, 700);
window.addEventListener('load', () => { pinBar(); pinTabs(); setTimeout(() => { pinBar(); pinTabs(); }, 300); });
pinBar();
pinTabs();

/* ---------- ボード（プロジェクト）の切り替え・作成・名前変更・削除 ---------- */
function renderTabs() {
  tabEl.innerHTML = '';
  for (const m of boardsMeta) {
    const b = document.createElement('button');
    b.className = 'btab' + (m.id === activeBoardId ? ' on' : '');
    b.textContent = m.name;
    b.addEventListener('click', () => switchBoard(m.id));
    tabEl.appendChild(b);
  }
}
function switchBoard(id) {
  if (id === activeBoardId || !boardsMeta.some(b => b.id === id)) return;
  if (cropState) cancelCrop(cropState.pid);
  selectPlacement(null);
  if (rangeMode) { rangeMode = false; rangeBtn.classList.remove('on'); clearMultiSel(); }
  boardCameras[activeBoardId] = camera;
  otherBoards.set(activeBoardId, placements);
  activeBoardId = id;
  placements = otherBoards.get(id) || [];
  otherBoards.delete(id);
  camera = boardCameras[id] || { cx: 0, cy: 0, scale: 1 };
  renderAll();
  applyCamera();
  renderTabs();
  saveLocal();
}
const menuBoardDelete = document.getElementById('menuBoardDelete');
let boardDeleteArmed = false, boardDeleteTimer = null;
function disarmBoardDelete() {
  boardDeleteArmed = false;
  clearTimeout(boardDeleteTimer);
  menuBoardDelete.textContent = 'ボードを削除';
}
document.getElementById('menuBoardNew').addEventListener('click', () => {
  menuEl.classList.remove('open');
  disarmBoardDelete();
  const def = 'ボード' + (boardsMeta.length + 1);
  const name = prompt('新しいボードの名前', def);
  if (name === null) return;
  pushHistory();
  const id = 'b-' + makeId();
  boardsMeta.push({ id, name: name.trim() || def, updatedAt: new Date().toISOString() });
  otherBoards.set(id, []);
  metaDirty = true;
  switchBoard(id);
  updateStatusLine();
});
document.getElementById('menuBoardRename').addEventListener('click', () => {
  menuEl.classList.remove('open');
  disarmBoardDelete();
  const m = boardsMeta.find(b => b.id === activeBoardId);
  if (!m) return;
  const name = prompt('ボードの名前を変更', m.name);
  if (name === null) return;
  pushHistory();
  m.name = name.trim() || m.name;
  m.updatedAt = new Date().toISOString();
  metaDirty = true;
  renderTabs();
  saveLocal();
  updateStatusLine();
});
menuBoardDelete.addEventListener('click', () => {
  if (boardsMeta.length <= 1) return;
  if (!boardDeleteArmed) {
    boardDeleteArmed = true;
    menuBoardDelete.textContent = '本当に削除する？（もう一度タップ）';
    boardDeleteTimer = setTimeout(disarmBoardDelete, 3000);
    return;
  }
  disarmBoardDelete();
  menuEl.classList.remove('open');
  pushHistory();
  if (cropState) cancelCrop(cropState.pid);
  selectPlacement(null);
  if (rangeMode) { rangeMode = false; rangeBtn.classList.remove('on'); clearMultiSel(); }
  const id = activeBoardId;
  for (const p of placements) deletedPlacementIds.add(p.pid);
  deletedBoardIds.add(id);
  boardsMeta = boardsMeta.filter(b => b.id !== id);
  otherBoards.delete(id);
  delete boardCameras[id];
  activeBoardId = boardsMeta[0].id;
  placements = otherBoards.get(activeBoardId) || [];
  otherBoards.delete(activeBoardId);
  camera = boardCameras[activeBoardId] || { cx: 0, cy: 0, scale: 1 };
  metaDirty = true;
  renderAll();
  applyCamera();
  renderTabs();
  saveLocal();
  updateStatusLine();
});

/* 画像アイコン（目・同期）は白い字形のPNGなので、ライトな背景の時は
   ダークモードの背景色（#2b2b30）に塗り直した版に差し替える（kura指定） */
function recolorIcon(img, color) {
  if (img.dataset.origSrc === undefined) img.dataset.origSrc = img.src;
  if (!img.dataset.darkSrc) {
    if (!img.naturalWidth) return;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, c.width, c.height);
    img.dataset.darkSrc = c.toDataURL();
  }
  img.src = img.dataset.darkSrc;
}
function refreshIconColors() {
  const light = document.documentElement.classList.contains('canvas-light');
  for (const img of document.querySelectorAll('#fitBtn img, #syncBtn img')) {
    if (light) recolorIcon(img, '#2b2b30');
    else if (img.dataset.origSrc) img.src = img.dataset.origSrc;
  }
}
for (const img of document.querySelectorAll('#fitBtn img, #syncBtn img')) {
  if (img.complete && img.naturalWidth) refreshIconColors();
  else img.addEventListener('load', refreshIconColors, { once: true });
}

/* ================= テキスト（メモ） =================
   テキストも配置の一種として扱う。item = {kind:'text', text} で、画像ファイルは持たない。
   テキストモード中にキャンバスをタップすると、その場に編集エリアが出る */
const textBtn = document.getElementById('textBtn');
const textEditorEl = document.getElementById('textEditor');
const textInputEl = document.getElementById('textInput');
let textEdit = null;   // {pid} 既存の編集 / {wx, wy} 新規作成
textBtn.addEventListener('click', () => {
  textMode = !textMode;
  textBtn.classList.toggle('on', textMode);
  if (textMode) {
    if (rangeMode) { rangeMode = false; rangeBtn.classList.remove('on'); clearMultiSel(); }
    if (cropState) cancelCrop(cropState.pid);
  }
});
/* 編集中のエディタを、対象テキストの画面上の外接矩形に合わせて置く。
   拡縮・回転のドラッグ中も positionFrameEl 経由で呼ばれ、枠に追随する */
function layoutTextEditor() {
  if (!textEdit || !textEdit.pid) return;
  const p = placementByPid(textEdit.pid);
  if (!p) return;
  const r = viewport.getBoundingClientRect();
  const th = (p.angle || 0) * Math.PI / 180, cosT = Math.cos(th), sinT = Math.sin(th);
  const hw = p.w * camera.scale / 2, hh = p.h * camera.scale / 2;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [lx, ly] of [[-hw, -hh], [hw, -hh], [-hw, hh], [hw, hh]]) {
    const sx2 = (p.x - camera.cx) * camera.scale + r.width / 2 + lx * cosT - ly * sinT;
    const sy2 = (p.y - camera.cy) * camera.scale + r.height / 2 + lx * sinT + ly * cosT;
    minX = Math.min(minX, sx2); minY = Math.min(minY, sy2); maxX = Math.max(maxX, sx2); maxY = Math.max(maxY, sy2);
  }
  let width = Math.min(maxX - minX, r.width - 16);   /* 幅も確定済みボックスと一致させる（最小幅で膨らませない） */
  textEditorEl.style.left = Math.max(8, Math.min(minX, r.width - width - 8)) + 'px';
  textEditorEl.style.top = Math.max(44, Math.min(minY, r.height - 170)) + 'px';
  textEditorEl.style.width = width + 'px';
  /* 入力エリアの高さは確定済みボックスと一致させる（入力モードで箱の大きさを変えない。kura指定）。
     文字サイズは固定のまま、拡縮で変わるのは改行位置だけ */
  textInputEl.style.height = (maxY - minY) + 'px';
  if (textEdit.fontWorld) textInputEl.style.fontSize = (textEdit.fontWorld * camera.scale) + 'px';
}
function openTextEditor(pid, wx, wy) {
  const r = viewport.getBoundingClientRect();
  if (pid) {
    const p = placementByPid(pid);
    if (!p) return;
    selectPlacement(pid);
    const it = itemOf(p);
    textInputEl.value = it ? (it.text || '') : '';
    textInputEl.style.height = '';
    if (it && !it.fontSize) {
      /* 旧テキストは今の見た目のサイズを測って固定する（見た目は変えない） */
      it.fontSize = fittedFontWorld(p.w, p.h, it.text || '');
      metaDirty = true;
      saveLocal();
      scheduleSync();
    }
    textEdit = { pid, fontWorld: it ? (it.fontSize || 16) : 16 };
    const fel = frameEls.get(pid);
    if (fel) fel.classList.add('editing');
    layoutTextEditor();
  } else {
    /* 幅は「ワールド幅 × scale」で一貫させる。px側の最小幅(180)を別に効かせると、
       ハンドルを最初に動かした瞬間に箱が縮んでしまう（2026-11-25 kura報告） */
    const w0 = Math.max(240, Math.ceil(180 / camera.scale));
    let width = Math.min(w0 * camera.scale, r.width - 16);
    const left = (wx - camera.cx) * camera.scale + r.width / 2 - width / 2;
    const top = (wy - camera.cy) * camera.scale + r.height / 2 - (64 * camera.scale) / 2;
    textInputEl.value = '';
    textInputEl.style.height = (64 * camera.scale) + 'px';
    textEdit = { wx, wy, w: w0, h: 64, fontWorld: 16 / camera.scale };   /* 新規はまだ配置が無いので、箱の大きさと文字サイズをここで保持する */
    textEditorEl.style.left = Math.max(8, Math.min(left, r.width - width - 8)) + 'px';
    textEditorEl.style.top = Math.max(44, Math.min(top, r.height - 170)) + 'px';
    textEditorEl.style.width = width + 'px';
  }
  textEditorEl.classList.toggle('is-new', !pid);
  textEditorEl.classList.add('on');
  document.body.classList.add('text-editing');
  textInputEl.style.fontSize = ((textEdit.fontWorld || 16) * camera.scale) + 'px';
  textInputEl.style.lineHeight = '1.35';
  layoutFrameUi();   /* 枠側のUIを消して、入力エリア側だけにする */
  setTimeout(() => { textInputEl.focus(); }, 30);
}
function closeTextEditor() {
  textEdit = null;
  textEditorEl.classList.remove('on');
  document.body.classList.remove('text-editing');
  document.querySelectorAll('.frame.editing').forEach(el => el.classList.remove('editing'));
  layoutFrameUi();
  repinSoon();
  setTimeout(() => window.scrollTo(0, 0), 350);   /* キーボードを閉じた後に残った画面スクロールを戻す */
}
function applyTextEdit() {
  if (!textEdit) return;
  const val = textInputEl.value;
  const ed = textEdit;
  closeTextEditor();
  if (ed.pid) {
    const p = placementByPid(ed.pid);
    if (!p) return;
    if (!val.trim()) { deletePlacementFlow(ed.pid); return; }   /* 空にしたら削除 */
    const it = itemOf(p);
    if (it && it.text !== val) {
      pushHistory();
      it.text = val;
      p.u = Date.now();
      metaDirty = true;
      const el = frameEls.get(p.pid);
      if (el) { el.dataset.fitKey = ''; refreshFrameImage(p, el); positionFrameEl(p, el); }
      saveLocal();
      scheduleSync();
    }
  } else {
    if (!val.trim()) return;
    pushHistory();
    const bw = ed.w || 240, bh = ed.h || 64;
    const it = { id: 't-' + makeId(), kind: 'text', text: val, w: bw, h: bh, fontSize: ed.fontWorld || 16 };
    items.set(it.id, it);
    const np = { pid: 'p-' + makeId(), itemId: it.id, x: ed.wx, y: ed.wy, w: bw, h: bh, angle: 0, z: ++zCounter, u: Date.now() };
    placements.push(np);
    metaDirty = true;
    renderAll();
    selectPlacement(np.pid);
    saveLocal();
    scheduleSync();
  }
}
document.getElementById('textOk').addEventListener('click', applyTextEdit);
document.getElementById('textCancel').addEventListener('click', closeTextEditor);

/* 入力エリア四隅のハンドル: 入力中のその場で箱の大きさを変える。
   既存テキストは通常の拡縮と同じ計算（対角固定・ローカル座標）で配置を拡縮し、
   新規テキストはまだ配置が無いので、入力エリアの箱自体を拡縮して大きさを保持する */
document.querySelectorAll('.edit-handle').forEach(h => {
  h.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (!textEdit) return;
    if (!textEdit.pid) {
      /* 新規作成中: 中心を固定して箱を拡縮する */
      const sx2 = h.dataset.corner.includes('e') ? 1 : -1;
      const sy2 = h.dataset.corner.includes('s') ? 1 : -1;
      const startWpt = screenToWorld(e.clientX, e.clientY);
      const bd = { x0: startWpt.x, y0: startWpt.y, w0: textEdit.w || 240, h0: textEdit.h || 64, sx: sx2, sy: sy2 };
      const mv = (ev) => {
        const wpt = screenToWorld(ev.clientX, ev.clientY);
        textEdit.w = Math.max(60, bd.w0 + 2 * (wpt.x - bd.x0) * bd.sx);
        textEdit.h = Math.max(32, bd.h0 + 2 * (wpt.y - bd.y0) * bd.sy);
        const r2 = viewport.getBoundingClientRect();
        const wpx = textEdit.w * camera.scale, hpx = textEdit.h * camera.scale;
        const cxS = (textEdit.wx - camera.cx) * camera.scale + r2.width / 2;
        const cyS = (textEdit.wy - camera.cy) * camera.scale + r2.height / 2;
        textEditorEl.style.width = wpx + 'px';
        textEditorEl.style.left = Math.max(8, Math.min(cxS - wpx / 2, r2.width - wpx - 8)) + 'px';
        textEditorEl.style.top = Math.max(44, Math.min(cyS - hpx / 2, r2.height - 170)) + 'px';
        textInputEl.style.height = hpx + 'px';
      };
      const up = () => { h.removeEventListener('pointermove', mv); };
      h.setPointerCapture(e.pointerId);
      h.addEventListener('pointermove', mv);
      h.addEventListener('pointerup', up, { once: true });
      h.addEventListener('pointercancel', up, { once: true });
      return;
    }
    const p = placementByPid(textEdit.pid);
    if (!p) return;
    const c = h.dataset.corner;
    const sx = c.includes('e') ? 1 : -1;
    const sy = c.includes('s') ? 1 : -1;
    const startWorld = screenToWorld(e.clientX, e.clientY);
    beginDragHistory([p]);
    const th = (p.angle || 0) * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
    const anchorLX = -sx * p.w / 2, anchorLY = -sy * p.h / 2;
    const anchorWX = p.x + anchorLX * cos - anchorLY * sin;
    const anchorWY = p.y + anchorLX * sin + anchorLY * cos;
    const cornerWX = p.x + (sx * p.w / 2) * cos - (sy * p.h / 2) * sin;
    const cornerWY = p.y + (sx * p.w / 2) * sin + (sy * p.h / 2) * cos;
    const gdx = startWorld.x - cornerWX, gdy = startWorld.y - cornerWY;
    dragState = {
      mode: 'resize', pid: p.pid, pointerId: e.pointerId, sx, sy, cos, sin,
      anchorWX, anchorWY,
      grabLX: gdx * cos + gdy * sin, grabLY: -gdx * sin + gdy * cos
    };
    h.setPointerCapture(e.pointerId);
    h.addEventListener('pointermove', onDragMove);
    h.addEventListener('pointerup', onDragEnd, { once: true });
    h.addEventListener('pointercancel', onDragEnd, { once: true });
  });
});
/* 入力中、文字がある行より下の余白はドラッグでテキストを移動できるようにする（kura指定）。
   文字の上は通常通りカーソル移動・選択に使う。文字の描画後の高さは、同じ書式の
   見えない鏡要素で測る */
const textMirror = document.createElement('div');
textMirror.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden; box-sizing:border-box; font-size:16px; line-height:1.4; padding:8px 10px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; pointer-events:none;';
document.body.appendChild(textMirror);
function textContentBottom() {
  const cs = getComputedStyle(textInputEl);
  textMirror.style.width = textInputEl.clientWidth + 'px';
  textMirror.style.fontFamily = cs.fontFamily;
  textMirror.style.fontSize = cs.fontSize;
  textMirror.style.lineHeight = cs.lineHeight;
  textMirror.textContent = textInputEl.value + '\n';
  return 1.5 + textMirror.offsetHeight;   /* 1.5 = 入力欄のボーダー幅 */
}
/* テキストの文字サイズは、テキストごとに固定値（fontSize、ワールド単位）で持つ。
   将来のサイズ変更ボタンは、この値を変える想定。fontSize を持たない旧テキストは、
   初回編集時に今の見た目のサイズを測って固定する（測り方は枠側の自動調整と同じ） */
const fitMirror = document.createElement('div');
fitMirror.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden; box-sizing:border-box; padding:4px 6px; line-height:1.35; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; overflow:hidden; pointer-events:none;';
document.body.appendChild(fitMirror);
function fittedFontWorld(wW, hW, text) {
  fitMirror.style.width = wW + 'px';
  fitMirror.style.height = hW + 'px';
  fitMirror.style.fontFamily = getComputedStyle(textInputEl).fontFamily;
  fitMirror.textContent = text || ' ';
  let lo = 6, hi = Math.max(9, hW);
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    fitMirror.style.fontSize = mid + 'px';
    if (fitMirror.scrollHeight <= hW + 1 && fitMirror.scrollWidth <= wW + 1) lo = mid; else hi = mid;
  }
  return lo;
}
function startEditorMove(e, srcEl) {
  if (textEdit.pid) {
    const p = placementByPid(textEdit.pid);
    if (!p) return;
    const start = screenToWorld(e.clientX, e.clientY);
    beginDragHistory([p]);
    dragState = { mode: 'move', pid: p.pid, pointerId: e.pointerId, startX: start.x, startY: start.y, origX: p.x, origY: p.y, moved: false };
    srcEl.setPointerCapture(e.pointerId);
    srcEl.addEventListener('pointermove', onDragMove);
    srcEl.addEventListener('pointerup', onDragEnd, { once: true });
    srcEl.addEventListener('pointercancel', onDragEnd, { once: true });
  } else {
    const start = screenToWorld(e.clientX, e.clientY);
    const bd = { x0: start.x, y0: start.y, wx0: textEdit.wx, wy0: textEdit.wy };
    const mv = (ev) => {
      const wpt = screenToWorld(ev.clientX, ev.clientY);
      textEdit.wx = bd.wx0 + (wpt.x - bd.x0);
      textEdit.wy = bd.wy0 + (wpt.y - bd.y0);
      const r2 = viewport.getBoundingClientRect();
      const wpx = (textEdit.w || 240) * camera.scale, hpx = (textEdit.h || 64) * camera.scale;
      const cxS = (textEdit.wx - camera.cx) * camera.scale + r2.width / 2;
      const cyS = (textEdit.wy - camera.cy) * camera.scale + r2.height / 2;
      textEditorEl.style.left = Math.max(8, Math.min(cxS - wpx / 2, r2.width - wpx - 8)) + 'px';
      textEditorEl.style.top = Math.max(44, Math.min(cyS - hpx / 2, r2.height - 170)) + 'px';
    };
    const up = () => { srcEl.removeEventListener('pointermove', mv); };
    srcEl.setPointerCapture(e.pointerId);
    srcEl.addEventListener('pointermove', mv);
    srcEl.addEventListener('pointerup', up, { once: true });
    srcEl.addEventListener('pointercancel', up, { once: true });
  }
}
textInputEl.addEventListener('pointerdown', (e) => {
  if (!textEdit) return;
  const rect = textInputEl.getBoundingClientRect();
  if (e.clientY - rect.top <= textContentBottom() + 6) return;   /* 文字の行の上は通常通り */
  e.preventDefault();
  e.stopPropagation();
  startEditorMove(e, textInputEl);
});
document.getElementById('textEditorBtns').addEventListener('pointerdown', (e) => {
  if (!textEdit || e.target !== e.currentTarget) return;   /* ボタン自体ではなく、行の余白部分だけ */
  e.preventDefault();
  e.stopPropagation();
  startEditorMove(e, e.currentTarget);
});
/* 編集エリアの外をタップしたら適用して閉じる（トリミングの外側タップと同じ考え方）。
   ただし画面固定UI（拡縮・回転ハンドルやツールバー）の上は閉じない:
   入力モードのままサイズ変更などをできるようにするため */
document.addEventListener('pointerdown', (e) => {
  if (textEdit && !e.target.closest('#frameUi, #multiUi')) applyTextEdit();
}, true);
document.getElementById('fitBtn').addEventListener('click', () => {
  if (!placements.length) { camera = { cx: 0, cy: 0, scale: 1 }; applyCamera(); return; }
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const p of placements) {
    l = Math.min(l, p.x - p.w / 2); t = Math.min(t, p.y - p.h / 2);
    r = Math.max(r, p.x + p.w / 2); b = Math.max(b, p.y + p.h / 2);
  }
  const view = viewport.getBoundingClientRect();
  const bw = (r - l) + 120, bh = (b - t) + 120;
  camera.scale = clamp(Math.min(view.width / bw, view.height / bh), 0.05, 2);
  camera.cx = (l + r) / 2; camera.cy = (t + b) / 2;
  applyCamera();
  saveLocal();
  for (const p of placements) { const el = frameEls.get(p.pid); if (el) refreshFrameImage(p, el); }
});
window.addEventListener('online', () => scheduleSync());

/* 画面が前面に戻ってきたら、読み込みだけ自動でやり直す（コミットはしない）。
   スリープ解除やアプリ切り替えのたびに、他の端末の更新分が入るようにするため。
   トリミング中は描き直しで崩れるので見送る。短時間の連打も抑える */
let lastPullAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (cropState || freeState) return;
  const now = Date.now();
  if (now - lastPullAt < 5000) return;
  lastPullAt = now;
  pullOnly();
});

/* 起動時は読み込みだけ（マージのみ、コミットはしない） */
async function pullOnly() {
  if (!getToken() || syncing) return;
  try {
    const remoteIndex = await ghFetchJson('data/index.json');
    const remoteBoards = await ghFetchJson('data/boards.json');
    mergeData(remoteIndex, remoteBoards);
    await saveLocal();
    renderAll();
    renderTabs();
  } catch (e) {}
  updateStatusLine();
}

/* ================= 起動 ================= */
(async function init() {
  await loadLocal();
  applyCamera();
  renderAll();
  renderTabs();
  updateStatusLine();
  if (getToken()) pullOnly();
})();
</script>
</body>
